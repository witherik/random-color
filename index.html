<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!-- ARTIFACT-START -->
<title>Pixel Roller</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Layout: one arcade-cabinet column. Canvas on top, controls below, last 10 rolls as a strip. Single dark theme by choice. */
  :root {
    --bg: #14121c;
    --panel: #1e1b2a;
    --edge: #35304a;
    --fg: #ece8f6;
    --muted: #9690ad;
    --accent: #ffcd75;
    --accent-ink: #1a1c2c;
    --font-display: "Silkscreen", "Courier New", monospace;
    --font-body: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    margin: 0;
    font: 14px/1.5 var(--font-body);
    padding-block: 20px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font: 400 26px/1 var(--font-display); margin: 0; letter-spacing: 0.02em; color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .screen {
    background: var(--panel);
    border: 2px solid var(--edge);
    padding: 10px;
    display: grid;
    gap: 8px;
  }
  .canvas-btn {
    display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in;
  }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
  #main { aspect-ratio: 1; max-width: 100%; }
  .screen-foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .swatches { display: flex; flex-wrap: wrap; gap: 3px; }
  .swatches span { width: 18px; height: 18px; border: 1px solid rgba(0,0,0,.4); }

  .controls { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  button.roll {
    font: 400 20px/1 var(--font-display);
    padding: 16px 12px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; box-shadow: 0 5px 0 #b86f50;
    cursor: pointer; touch-action: manipulation;
  }
  button.roll:active { transform: translateY(4px); box-shadow: 0 1px 0 #b86f50; }
  select {
    font: 600 14px var(--font-body); color: var(--fg); background: var(--panel);
    border: 2px solid var(--edge); padding: 0 10px; min-height: 48px;
  }
  button:focus-visible, select:focus-visible, .thumb:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  h2 { font: 400 14px/1 var(--font-display); margin: 0; color: var(--muted); letter-spacing: 0.06em; }
  .history { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .thumb {
    padding: 0; border: 2px solid var(--edge); background: var(--panel); cursor: zoom-in;
    display: grid; gap: 2px; color: var(--muted); font: 11px var(--font-body); font-variant-numeric: tabular-nums;
  }
  .thumb.current { border-color: var(--accent); color: var(--accent); }
  .thumb span { padding: 2px 0 3px; }
  .empty { aspect-ratio: 1; border: 2px dashed var(--edge); }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }

  dialog {
    border: 2px solid var(--edge); background: var(--panel); color: var(--fg);
    padding: 12px; max-width: 96vw; max-height: 96vh;
  }
  dialog::backdrop { background: rgba(8, 6, 14, 0.88); }
  #big { width: min(88vw, 80vh); aspect-ratio: 1; cursor: zoom-out; }
  .dlg-foot { display: flex; justify-content: space-between; gap: 12px; padding-top: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dlg-foot button { font: 600 12px var(--font-body); background: none; color: var(--fg); border: 1px solid var(--edge); padding: 4px 10px; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) { button.roll:active { transform: none; } }
</style>

<main>
  <header>
    <h1>Pixel Roller</h1>
    <div class="meta" id="count">0 rolls</div>
  </header>

  <section class="screen" aria-label="Current painting">
    <button class="canvas-btn" id="mainBtn" aria-label="Enlarge current painting">
      <canvas id="main" width="32" height="32"></canvas>
    </button>
    <div class="screen-foot"><span id="seedLabel">seed —</span><span>32 × 32</span></div>
    <div class="swatches" id="swatches" aria-label="Palette colors"></div>
  </section>

  <div class="controls">
    <button class="roll" id="roll">Roll</button>
    <select id="palette" aria-label="Palette"></select>
  </div>

  <section style="display:grid;gap:10px" aria-label="Past rolls">
    <h2>Last 10 rolls</h2>
    <div class="history" id="history"></div>
    <p class="hint">Tap a painting to enlarge it. Press Space to roll.</p>
  </section>
</main>

<dialog id="dlg">
  <canvas id="big" width="32" height="32"></canvas>
  <div class="dlg-foot"><span id="dlgLabel"></span><button id="close">Close</button></div>
</dialog>

<script>
(() => {
  const SIZE = 32, KEEP = 10;
  const PALETTES = {
    "Sweetie 16": ["#1a1c2c","#5d275d","#b13e53","#ef7d57","#ffcd75","#a7f070","#38b764","#257179","#29366f","#3b5dc9","#41a6f6","#73eff7","#f4f4f4","#94b0c2","#566c86","#333c57"],
    "C64": ["#000000","#ffffff","#880000","#aaffee","#cc44cc","#00cc55","#0000aa","#eeee77","#dd8855","#664400","#ff7777","#333333","#777777","#aaff66","#0088ff","#bbbbbb"],
    "CGA": ["#000000","#0000aa","#00aa00","#00aaaa","#aa0000","#aa00aa","#aa5500","#aaaaaa","#555555","#5555ff","#55ff55","#55ffff","#ff5555","#ff55ff","#ffff55","#ffffff"],
    "Green LCD": ["#0f380f","#306230","#8bac0f","#9bbc0f"],
    "Amber CRT": ["#1a0f00","#4d2b00","#995500","#e68a00","#ffb000","#ffd27a"]
  };

  const $ = id => document.getElementById(id);
  const store = {
    get() { try { return JSON.parse(localStorage.getItem("pixel-roller") || "null"); } catch { return null; } },
    set(v) { try { localStorage.setItem("pixel-roller", JSON.stringify(v)); } catch {} }
  };

  // Seeded PRNG: each roll is stored as seed + palette, so a painting is fully reproducible.
  function mulberry32(a) {
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function paint(canvas, roll) {
    const colors = PALETTES[roll.palette] || PALETTES["Sweetie 16"];
    const rnd = mulberry32(roll.seed);
    const ctx = canvas.getContext("2d");
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
      ctx.fillStyle = colors[Math.floor(rnd() * colors.length)];
      ctx.fillRect(x, y, 1, 1);
    }
  }

  const saved = store.get() || {};
  let state = {
    palette: PALETTES[saved.palette] ? saved.palette : "Sweetie 16",
    total: saved.total || 0,
    history: Array.isArray(saved.history) ? saved.history.slice(0, KEEP) : []
  };

  const sel = $("palette");
  for (const name of Object.keys(PALETTES)) sel.add(new Option(name, name));
  sel.value = state.palette;

  const label = r => `#${String(r.n).padStart(3, "0")} · ${r.palette} · seed ${r.seed.toString(16).padStart(8, "0")}`;

  function renderSwatches() {
    $("swatches").replaceChildren(...PALETTES[state.palette].map(c => {
      const s = document.createElement("span"); s.style.background = c; s.title = c; return s;
    }));
  }

  function render() {
    const cur = state.history[0];
    if (cur) { paint($("main"), cur); $("seedLabel").textContent = label(cur); }
    $("count").textContent = `${state.total} roll${state.total === 1 ? "" : "s"}`;
    const slots = [];
    for (let i = 0; i < KEEP; i++) {
      const r = state.history[i];
      if (!r) { const e = document.createElement("div"); e.className = "empty"; slots.push(e); continue; }
      const b = document.createElement("button");
      b.className = "thumb" + (i === 0 ? " current" : "");
      b.setAttribute("aria-label", "Enlarge roll " + r.n);
      const c = document.createElement("canvas"); c.width = c.height = SIZE; paint(c, r);
      const t = document.createElement("span"); t.textContent = "#" + r.n;
      b.append(c, t);
      b.addEventListener("click", () => openBig(r));
      slots.push(b);
    }
    $("history").replaceChildren(...slots);
    renderSwatches();
  }

  function roll() {
    const seed = crypto.getRandomValues(new Uint32Array(1))[0];
    state.total += 1;
    state.history.unshift({ n: state.total, seed, palette: state.palette });
    state.history = state.history.slice(0, KEEP);
    store.set(state);
    render();
  }

  function openBig(r) {
    paint($("big"), r);
    $("dlgLabel").textContent = label(r);
    $("dlg").showModal();
  }

  $("roll").addEventListener("click", roll);
  $("mainBtn").addEventListener("click", () => state.history[0] && openBig(state.history[0]));
  $("close").addEventListener("click", () => $("dlg").close());
  $("big").addEventListener("click", () => $("dlg").close());
  $("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });
  sel.addEventListener("change", () => { state.palette = sel.value; store.set(state); renderSwatches(); });
  document.addEventListener("keydown", e => {
    if (e.code === "Space" && !$("dlg").open && e.target.tagName !== "SELECT" && e.target.tagName !== "BUTTON") { e.preventDefault(); roll(); }
  });

  if (!state.history.length) roll(); else render();
})();
</script>
<!-- ARTIFACT-END -->
</body>
</html>
